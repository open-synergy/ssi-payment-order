scenarios:
  - name: "Payment Order Bank Cash Voucher - Create Payment Order Type With Bank"
    steps:
      - step: "Get bank journal"
        action: "search"
        model: "account.journal"
        save_as: "journal"
        domain: [["type", "=", "bank"]]
        limit: 1

      - step: "Create payment order type with bank"
        action: "create"
        model: "payment_order_type"
        save_as: "order_type"
        values:
          name: "Test Bank Payment Order Type"
          code: "TST-BPOT"
          journal_id: "EVAL: registry['journal'].id"
          realization_method: "bank"

      - step: "Assert order type created"
        action: "assert"
        target: "order_type"
        asserts:
          name:
            type: "value"
            expected: "Test Bank Payment Order Type"

  - name: "Payment Order Bank Cash Voucher - Create Payment Order"
    steps:
      - step: "Get bank journal"
        action: "search"
        model: "account.journal"
        save_as: "journal"
        domain: [["type", "=", "bank"]]
        limit: 1

      - step: "Create payment order type"
        action: "create"
        model: "payment_order_type"
        save_as: "order_type"
        values:
          name: "Test Bank PO Type"
          code: "TST-BPOT2"
          journal_id: "EVAL: registry['journal'].id"
          realization_method: "bank"

      - step: "Create payment order"
        action: "create"
        model: "payment_order"
        save_as: "payment_order"
        as_user: "base.user_admin"
        values:
          type_id: "EVAL: registry['order_type'].id"
          date: "2024-01-01"

      - step: "Assert payment order in draft"
        action: "assert"
        target: "payment_order"
        asserts:
          state:
            type: "value"
            expected: "draft"
