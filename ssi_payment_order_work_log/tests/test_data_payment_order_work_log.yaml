scenarios:
  - name: "Payment Order Work Log - Create Payment Order"
    steps:
      - step: "Get bank journal"
        action: "search"
        model: "account.journal"
        save_as: "journal"
        domain: [["type", "=", "bank"]]
        limit: 1

      - step: "Create payment order type"
        action: "create"
        model: "payment_order_type"
        save_as: "order_type"
        values:
          name: "Test Work Log PO Type"
          code: "TST-WLPOT"
          journal_id: "EVAL: registry['journal'].id"
          realization_method: "manual"

      - step: "Create payment order"
        action: "create"
        model: "payment_order"
        save_as: "payment_order"
        as_user: "base.user_admin"
        values:
          type_id: "EVAL: registry['order_type'].id"
          date: "2024-01-01"

      - step: "Assert payment order in draft"
        action: "assert"
        target: "payment_order"
        asserts:
          state:
            type: "value"
            expected: "draft"
